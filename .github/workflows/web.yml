name: Web

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_dispatch:

concurrency:
    group: web-${{ github.ref }}
    cancel-in-progress: true

env:
    # Prisma refuses to read the schema unless BOTH datasource env vars exist
    DATABASE_URL: postgresql://ci:ci@localhost:5432/placeholder
    DIRECT_URL: postgresql://ci:ci@localhost:5432/placeholder
    BETTER_AUTH_URL: http://localhost:3000
    BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
    GOOGLE_CLIENT_ID: ci-placeholder
    GOOGLE_CLIENT_SECRET: ci-placeholder
    GITHUB_CLIENT_ID: ci-placeholder
    GITHUB_CLIENT_SECRET: ci-placeholder

jobs:
    build:
        name: Typecheck and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  # pnpm 11 needs >= 22.13 and imports node:sqlite
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The app imports @mathscript/postgres, so its dist has to exist before tsc or next can resolve it.
            - name: Build workspace packages
              run: pnpm turbo run build

            - name: Typecheck
              run: pnpm typecheck

            - name: Build Next.js app
              run: pnpm exec next build

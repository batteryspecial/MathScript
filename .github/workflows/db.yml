name: Database

on:
    push:
        branches: ["**"]
        paths:
            - "packages/postgres/**"
            - ".github/workflows/db.yml"
    pull_request:
        paths:
            - "packages/postgres/**"
            - ".github/workflows/db.yml"
    workflow_dispatch:

concurrency:
    group: db-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: packages/postgres

jobs:
    # Proves the migrations replay cleanly onto an empty database
    schema:
        name: Migrations and drift
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: mathscript_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mathscript_ci
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mathscript_ci
            SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mathscript_shadow

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Schema is valid
              run: pnpm exec prisma validate

            - name: Migrations apply to an empty database
              run: pnpm exec prisma migrate deploy

            # `migrate diff` needs a scratch database to replay the migration history into before comparing it against schema.prisma.
            - name: Create shadow database
              run: |
                  PGPASSWORD=postgres psql -h localhost -U postgres \
                    -c 'CREATE DATABASE mathscript_shadow;'

            # Exit code 2 means schema.prisma changed without a matching migration
            - name: No drift between schema.prisma and migrations
              run: |
                  pnpm exec prisma migrate diff \
                    --from-migrations ./src/prisma/migrations \
                    --to-schema-datamodel ./src/prisma/schema.prisma \
                    --shadow-database-url "$SHADOW_DATABASE_URL" \
                    --exit-code

            - name: Every table was created
              run: |
                  PGPASSWORD=postgres psql -h localhost -U postgres -d mathscript_ci \
                    -c '\dt' | tee /dev/stderr | grep -q 'Project'
                  PGPASSWORD=postgres psql -h localhost -U postgres -d mathscript_ci \
                    -tAc "select count(*) from information_schema.tables
                          where table_schema='public'
                            and table_name in ('Project','Node','Document','Cell',
                                               'user','session','account','verification',
                                               'twoFactor','rateLimit')" \
                    | grep -qx 10
            - name: Auth wiring is intact
              run: |
                  PGPASSWORD=postgres psql -h localhost -U postgres -d mathscript_ci \
                    -tAc "select data_type from information_schema.columns
                          where table_name='rateLimit' and column_name='lastRequest'" \
                    | grep -qx bigint
                  PGPASSWORD=postgres psql -h localhost -U postgres -d mathscript_ci \
                    -tAc "select count(*) from information_schema.referential_constraints rc
                          join information_schema.table_constraints tc
                            on tc.constraint_name = rc.constraint_name
                          where tc.table_name in ('Project','Node','Document','Cell',
                                                  'session','account','twoFactor')
                            and rc.delete_rule = 'CASCADE'" \
                    | grep -qx 8
    connection:
        name: Testing branch reachable
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: ${{ secrets.TESTING_DATABASE_URL }}
            DIRECT_URL: ${{ secrets.TESTING_DIRECT_URL }}

        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: .

            - name: Are the secrets configured?
              id: guard
              run: |
                  if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::TESTING_DATABASE_URL / TESTING_DIRECT_URL not set — skipping the testing-branch check."
                  else
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  fi

            # Read-only: reports which migrations are applied, changes nothing.
            - name: Migration status
              if: steps.guard.outputs.configured == 'true'
              run: pnpm exec prisma migrate status
